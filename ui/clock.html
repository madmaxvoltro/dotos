<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Clock</title>
<link rel="stylesheet" href="/css/dot.css">
</head>
<body>
<div id="app"></div>
<script type="module">
// The idle clock for a second monitor. It never wakes anything; the main monitor owns input.
import { idle } from "/js/screens.js";

const app = document.getElementById("app");
function layout() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  app.style.width = `${innerWidth / s}px`;
  app.style.height = `${innerHeight / s}px`;
  app.style.transform = `scale(${s})`;
}
addEventListener("resize", layout);
layout();
const root = document.createElement("div");
root.style.cssText = "position:absolute;inset:0";
app.appendChild(root);
idle(root, { wake: () => {} });
</script>
</body>
</html>
